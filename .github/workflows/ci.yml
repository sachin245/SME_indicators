name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check . --exclude venv --exclude frontend --exclude graphify-out
        continue-on-error: true

      - name: Compile-check all Python sources
        run: |
          python -m compileall -q \
            agent.py config.py \
            api dashboard indicators parsers scrapers storage

      - name: Smoke-test imports
        env:
          DB_PATH: data/ci.duckdb
          OPENAI_API_KEY: ""
          USE_AI_PARSER: "false"
        run: |
          mkdir -p data
          python - <<'PY'
          # Importing each module surfaces top-level errors that compileall misses.
          import importlib
          for mod in [
              "config",
              "storage.database",
              "storage.sectors",
              "indicators.engine",
              "parsers.pdf_parser",
              "parsers.xbrl_parser",
              "scrapers.bse_scraper",
              "api.main",
              "api.routers.pipeline",
              "api.routers.indicators",
              "api.routers.filings",
              "api.routers.financials",
              "api.routers.summary",
          ]:
              importlib.import_module(mod)
              print("ok", mod)

          # Database round-trip
          from storage.database import init_db, query
          init_db()
          query("SELECT 1 AS x")
          print("db ok")

          # FastAPI app boots
          from fastapi.testclient import TestClient
          from api.main import app
          c = TestClient(app)
          assert c.get("/api/health").json()["status"] == "ok"
          print("api ok")
          PY

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          retention-days: 7

  streamlit:
    name: Streamlit admin (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt streamlit

      - name: Syntax + import check for dashboard
        run: |
          python -m compileall -q dashboard/app.py
          python -c "import ast,io; ast.parse(io.open('dashboard/app.py',encoding='utf-8').read()); print('streamlit ok')"
